name: Inspector tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  inspector:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
# Native JIT/fixture checks run locally with CTest on Apple Silicon and SDK 27.
